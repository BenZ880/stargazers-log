<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazer's log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Open Source Bookmarks</p>
        <h1>Stargazer's log</h1>
        <p>A small collection of repositories worth keeping an eye on.</p>
      </header>

      <section aria-labelledby="repositories-heading">
        <div class="section-heading">
          <h2 id="repositories-heading">Starred repositories</h2>
          <span id="repository-count" class="repository-count" aria-live="polite"></span>
        </div>
        <ul id="repository-list" class="repository-list" aria-live="polite">
          <li class="status-message">Loading repositories...</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
